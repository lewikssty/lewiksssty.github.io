
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portofolio Lewik</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f0ff;
      color: #30254a;
      text-align: center;
    }
    header {
      background: #7653c7;
      color: white;
      padding: 60px 20px;
    }
    h1 { font-size: 42px; }
    main { padding: 35px 20px; }
    .card {
      background: white;
      max-width: 500px;
      margin: 20px auto;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 4px 14px #00000010;
    }
    a { color: #7653c7; }
  </style>
</head>
<body>
  <header>
    <h1>Halo, aku Lewik!</h1>
    <p>Selamat datang di website portofolio pribadiku ✨</p>
  </header>
  <main>
    <div class="card">
      <h2>Tentang Aku</h2>
      <p>Ini adalah website portofolio pertamaku.</p>
    </div>
    <div class="card">
      <h2>Proyekku</h2>
      <p>Segera hadir! Aku sedang membangun sesuatu yang keren.</p>
    </div>
  </main>
</body>
</html>
